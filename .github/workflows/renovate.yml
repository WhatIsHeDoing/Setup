---
name: Renovate

on:
    schedule:
        - cron: "0 20 1 * *" # Monday 20:00 UTC — gated to first Monday by renovate.json schedule
    workflow_dispatch:

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.0

            - uses: renovatebot/github-action@v46.1.16
              with:
                  # A PAT gives full PR creation; github.token is the fallback.
                  token: ${{ secrets.RENOVATE_TOKEN || github.token }}
