---
- name: Handle Windows dotfiles via WSL2 interop
  ansible.builtin.include_tasks: windows.yml
  when: effective_platform == "windows"

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Ensure ~/.config/atuin directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/atuin"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy Atuin configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/atuin.toml"
      dest: "{{ ansible_env.HOME }}/.config/atuin/config.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Deploy Starship configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/starship.toml"
      dest: "{{ ansible_env.HOME }}/.config/starship.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.config/zsh directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/zsh"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

# No `backup:`; a backup file here would match the glob ~/.zshrc sources.
# A fragment renamed or dropped in config/zsh/ keeps loading until deleted
# by hand.
- name: Deploy zsh configuration fragments
  ansible.builtin.copy:
      src: "{{ item }}"
      dest: "{{ ansible_env.HOME }}/.config/zsh/{{ item | basename }}"
      mode: "0644"
  loop: "{{ zsh_fragments }}"
  loop_control:
      label: "{{ item | basename }}"
  when: effective_platform != "windows"

# `force: false`: the machine owns this file after the first run.
- name: Seed the local zsh override file
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/zsh/99-local.zsh.example"
      dest: "{{ zsh_local_fragment }}"
      mode: "0644"
      force: false
  when: effective_platform != "windows"

# 00-path.zsh explains the .zprofile hook and guards the second source from
# the ~/.zshrc glob.
- name: Source the PATH fragment from .zprofile
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zprofile"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: zsh config"
      block: |
          [ -r "$HOME/.config/zsh/00-path.zsh" ] && source "$HOME/.config/zsh/00-path.zsh"
      create: true
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

# The (N) qualifier makes an empty directory expand to nothing rather than
# an error.
- name: Source the zsh fragments from .zshrc
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: zsh config"
      block: |
          for _zsh_fragment in "$HOME"/.config/zsh/*.zsh(N); do
              source "$_zsh_fragment"
          done
          unset _zsh_fragment
      create: true
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure bottom config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/bottom"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy bottom configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/bottom.toml"
      dest: "{{ ansible_env.HOME }}/.config/bottom/bottom.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.config/bat directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/bat"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy bat configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/bat/config"
      dest: "{{ ansible_env.HOME }}/.config/bat/config"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.config/ripgrep directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/ripgrep"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy ripgrep configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/ripgrep/rc"
      dest: "{{ ansible_env.HOME }}/.config/ripgrep/rc"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Deploy global gitignore
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/gitignore_global"
      dest: "{{ ansible_env.HOME }}/.gitignore_global"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.local/bin"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Ensure Ghostty config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/Library/Application Support/com.mitchellh.ghostty"
      state: directory
      mode: "0755"
  when: effective_platform == "darwin"

- name: Deploy Ghostty configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/ghostty"
      dest: "{{ ansible_env.HOME }}/Library/Application Support/com.mitchellh.ghostty/config"
      mode: "0644"
      backup: true
  when: effective_platform == "darwin"

- name: Install scripts
  ansible.builtin.copy:
      src: "{{ repo_root }}/scripts/{{ item }}"
      dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
      mode: "0755"
  loop:
      - ff
      - ll
  when: effective_platform != "windows"

- name: Configure Claude Code MCP servers
  ansible.builtin.shell: |
    claude mcp list 2>/dev/null | grep -q "{{ item.name }}" || \
    claude mcp add {{ item.name }} -s user -- {{ item.command }}
  args:
      executable: /bin/bash
  loop: "{{ mcp_servers }}"
  loop_control:
      label: "{{ item.name }}"
  changed_when: false
  when: effective_platform != "windows"
