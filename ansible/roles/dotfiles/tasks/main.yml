---
- name: Handle Windows dotfiles via WSL2 interop
  ansible.builtin.include_tasks: windows.yml
  when: effective_platform == "windows"

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Ensure ~/.config/atuin directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/atuin"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy Atuin configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/atuin.toml"
      dest: "{{ ansible_env.HOME }}/.config/atuin/config.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Deploy Starship configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/starship.toml"
      dest: "{{ ansible_env.HOME }}/.config/starship.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

# ── Zsh configuration ────────────────────────────────────────────────────
# Shell config lives in config/zsh/*.zsh as real, readable, syntax-checkable
# files rather than as shell code embedded in YAML strings. The role deploys
# them and adds one source hook to each startup file. See ADR-0008.
#
# The numeric filename prefixes set load order: PATH first, because everything
# else depends on it, and plugins last, because zsh-syntax-highlighting has to
# wrap the finished set of line-editor widgets.
- name: Ensure ~/.config/zsh directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/zsh"
      state: directory
      mode: "0755"
  when: effective_platform == "darwin"

# No `backup:` — the repo is the source of truth for these files, and a
# backup written alongside them would land in the directory ~/.zshrc globs.
- name: Deploy zsh configuration fragments
  ansible.builtin.copy:
      src: "{{ item }}"
      dest: "{{ ansible_env.HOME }}/.config/zsh/{{ item | basename }}"
      mode: "0644"
  loop: "{{ zsh_fragments }}"
  loop_control:
      label: "{{ item | basename }}"
  when: effective_platform == "darwin"

# Escape hatch for settings that are personal to one machine — agent sockets,
# credentials, per-host paths. Seeded once and never overwritten, so it is the
# one file here the repo does not own. It sorts last and can override anything.
- name: Seed the local zsh override file
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/zsh/99-local.zsh.example"
      dest: "{{ zsh_local_fragment }}"
      mode: "0644"
      force: false
  when: effective_platform == "darwin"

# ~/.zshrc sources whatever matches the glob, so a fragment renamed or dropped
# in the repo would go on being loaded from a previous run until removed here.
- name: Find deployed zsh fragments
  ansible.builtin.find:
      paths: "{{ ansible_env.HOME }}/.config/zsh"
      patterns: "*.zsh"
  register: deployed_zsh_fragments
  when: effective_platform == "darwin"

- name: Remove orphaned zsh fragments
  ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
  loop: "{{ deployed_zsh_fragments.files | default([]) }}"
  loop_control:
      label: "{{ item.path | basename }}"
  when:
      - effective_platform == "darwin"
      - item.path != zsh_local_fragment
      - item.path | basename not in (zsh_fragments | map('basename') | list)

# Login shells need PATH corrected before ~/.zshrc runs, and ~/.zprofile is
# the first file zsh sources after /etc/zprofile's path_helper. 00-path.zsh
# guards against the double-source that ~/.zshrc's glob would otherwise cause.
- name: Source the PATH fragment from .zprofile
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zprofile"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: zsh config"
      block: |
          [ -r "$HOME/.config/zsh/00-path.zsh" ] && source "$HOME/.config/zsh/00-path.zsh"
      create: true
      mode: "0644"
      backup: true
  when: effective_platform == "darwin"

# The (N) glob qualifier makes an empty directory expand to nothing rather
# than erroring, so a half-applied run still leaves a usable shell.
- name: Source the zsh fragments from .zshrc
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: zsh config"
      block: |
          for _zsh_fragment in "$HOME"/.config/zsh/*.zsh(N); do
              source "$_zsh_fragment"
          done
          unset _zsh_fragment
      create: true
      mode: "0644"
      backup: true
  when: effective_platform == "darwin"

- name: Ensure bottom config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/bottom"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy bottom configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/bottom.toml"
      dest: "{{ ansible_env.HOME }}/.config/bottom/bottom.toml"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.config/bat directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/bat"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy bat configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/bat/config"
      dest: "{{ ansible_env.HOME }}/.config/bat/config"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.config/ripgrep directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.config/ripgrep"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

- name: Deploy ripgrep configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/ripgrep/rc"
      dest: "{{ ansible_env.HOME }}/.config/ripgrep/rc"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Deploy global gitignore
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/gitignore_global"
      dest: "{{ ansible_env.HOME }}/.gitignore_global"
      mode: "0644"
      backup: true
  when: effective_platform != "windows"

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.local/bin"
      state: directory
      mode: "0755"
  when: effective_platform != "windows"

# ── Migration from the pre-ADR-0008 layout ───────────────────────────────
# Removes the lines and blocks earlier versions of this role wrote directly
# into ~/.zshrc and ~/.zprofile. See roles/dotfiles/vars/main.yml — the whole
# section is transitional and can be deleted once machines have converged.
- name: Check whether the legacy startup files exist
  ansible.builtin.stat:
      path: "{{ ansible_env.HOME }}/{{ item }}"
  register: legacy_startup_files
  loop:
      - .zprofile
      - .zshrc
  when: effective_platform == "darwin"

- name: Remove legacy managed lines from .zshrc
  ansible.builtin.lineinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      regexp: "{{ item }}"
      state: absent
  loop: "{{ legacy_zshrc_patterns }}"
  when:
      - effective_platform == "darwin"
      - legacy_startup_files.results | selectattr("item", "equalto", ".zshrc")
        | map(attribute="stat.exists") | first

- name: Remove legacy managed blocks from .zshrc
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: {{ item }}"
      state: absent
  loop: "{{ legacy_zshrc_markers }}"
  when:
      - effective_platform == "darwin"
      - legacy_startup_files.results | selectattr("item", "equalto", ".zshrc")
        | map(attribute="stat.exists") | first

- name: Remove legacy managed blocks from .zprofile
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.zprofile"
      marker: "# {mark} ANSIBLE MANAGED BLOCK: {{ item }}"
      state: absent
  loop: "{{ legacy_zprofile_markers }}"
  when:
      - effective_platform == "darwin"
      - legacy_startup_files.results | selectattr("item", "equalto", ".zprofile")
        | map(attribute="stat.exists") | first

- name: Ensure Ghostty config directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/Library/Application Support/com.mitchellh.ghostty"
      state: directory
      mode: "0755"
  when: effective_platform == "darwin"

- name: Deploy Ghostty configuration
  ansible.builtin.copy:
      src: "{{ repo_root }}/config/ghostty"
      dest: "{{ ansible_env.HOME }}/Library/Application Support/com.mitchellh.ghostty/config"
      mode: "0644"
      backup: true
  when: effective_platform == "darwin"

- name: Install scripts
  ansible.builtin.copy:
      src: "{{ repo_root }}/scripts/{{ item }}"
      dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
      mode: "0755"
  loop:
      - ff
      - ll
  when: effective_platform != "windows"

# ── Claude Code MCP servers ──────────────────────────────────────────────
- name: Configure Claude Code MCP servers
  ansible.builtin.shell: |
    claude mcp list 2>/dev/null | grep -q "{{ item.name }}" || \
    claude mcp add {{ item.name }} -s user -- {{ item.command }}
  args:
      executable: /bin/bash
  loop: "{{ mcp_servers }}"
  loop_control:
      label: "{{ item.name }}"
  changed_when: false
  when: effective_platform != "windows"
