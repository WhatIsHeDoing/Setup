---
# Zsh config fragments, discovered rather than listed so adding one to
# config/zsh/ is the only step. Sorted because the numeric filename prefixes
# are what set load order, and ~/.zshrc sources them in glob (sorted) order.
zsh_fragments: "{{ query('fileglob', repo_root ~ '/config/zsh/*.zsh') | sort }}"

# Seeded from 99-local.zsh.example and then left alone. Named here because the
# orphan sweep must exempt it — it is deliberately absent from config/zsh/.
zsh_local_fragment: "{{ ansible_env.HOME }}/.config/zsh/99-local.zsh"

# Lines and blocks earlier versions of this role wrote directly into ~/.zshrc,
# one `lineinfile` task each. That content now lives in config/zsh/*.zsh and is
# sourced by a single managed block (ADR-0008), so the old copies have to go —
# left in place they would double-source the plugins and pin the pre-ADR-0008
# ordering, where zsh-syntax-highlighting loaded before atuin and fzf rather
# than last.
#
# This is transitional. Once every machine has run the playbook at least once,
# these tasks and this file can be deleted.
legacy_zshrc_patterns:
    - 'FZF_ALT_C_COMMAND='
    - 'FZF_ALT_C_OPTS='
    - 'FZF_CTRL_T_COMMAND='
    - 'FZF_CTRL_T_OPTS='
    - 'FZF_DEFAULT_COMMAND='
    - 'FZF_DEFAULT_OPTS='
    - 'RIPGREP_CONFIG_PATH='
    - 'ZSH_AUTOSUGGEST_STRATEGY='
    - 'atuin init zsh'
    - 'brew shellenv'
    - 'export NVM_DIR='
    - 'fzf/shell/completion\.zsh'
    - 'fzf/shell/key-bindings\.zsh'
    - 'opt/nvm/nvm\.sh'
    - 'starship init zsh'
    - 'zoxide init zsh'
    - 'zsh-autocomplete\.plugin\.zsh'
    - 'zsh-autosuggestions\.zsh'
    - 'zsh-syntax-highlighting\.zsh'

# `blockinfile` markers the role used to manage, removed by re-declaring the
# same marker with `state: absent`.
legacy_zshrc_markers:
    - aliases
    - history
    - shell options

# ADR-0007 shipped PATH handling as a literal block in ~/.zprofile before
# ADR-0008 moved it to config/zsh/00-path.zsh.
legacy_zprofile_markers:
    - path
