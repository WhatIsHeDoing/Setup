---
# Several entries here override a copy macOS already ships. Apple's are either
# frozen forks (jq), years behind (bash 3.2 from 2007, make 3.81 from 2006),
# or a different implementation entirely (openrsync in place of rsync). The
# GNU replacements install under `g`-prefixed names — `gsed`, `ggrep`, `gfind`,
# `gmake`, `gawk` and the coreutils set — and their `libexec/gnubin` dirs stay
# off PATH deliberately, so BSD semantics remain the default for any script
# that does not ask for GNU. See ADR-0007.
#
# bottom, cargo-cache, cargo-outdated, cargo-update, diskonaut and wasm-pack
# come from here rather than from cargo: Homebrew ships all six at upstream
# parity, and a bottle needs no compiler. See ADR-0010 for the three conditions
# that send a package back to cargo, uv or pnpm instead.
#
# cspell and yamllint joined them for the same reason. Both were held back on
# the grounds that their formulae pull in a second Node and a second Python
# beside the nvm and uv ones — but markdownlint-cli2, svgo and nuget in this
# very list already depend on those kegs, so the interpreters arrive whether or
# not cspell and yamllint do. Debian and Windows have no parity package for
# either, so they stay on pnpm and uv; see pnpm_packages_non_darwin and
# pip_packages_non_darwin in group_vars/all.yml.
# bats-assert and bats-support live in the bats-core tap rather than
# homebrew/core, which carries only bats-core itself. Homebrew resolves an
# unqualified name against tapped repositories once the tap is added, so the
# entries below stay bare and the tap task in tasks/darwin.yml runs first.
homebrew_taps:
    - bats-core/bats-core

homebrew_tools:
