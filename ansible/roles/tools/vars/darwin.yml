---
# Several entries here override a copy macOS already ships. Apple's are either
# frozen forks (jq), years behind (bash 3.2 from 2007, make 3.81 from 2006),
# or a different implementation entirely (openrsync in place of rsync). The
# GNU replacements install under `g`-prefixed names — `gsed`, `ggrep`, `gfind`,
# `gmake`, `gawk` and the coreutils set — and their `libexec/gnubin` dirs stay
# off PATH deliberately, so BSD semantics remain the default for any script
# that does not ask for GNU. See ADR-0007.
#
# bottom, cargo-outdated, cargo-update, diskonaut and wasm-pack come from here
# rather than from cargo: Homebrew ships all five at upstream parity, and a
# bottle needs no compiler. See ADR-0010 for the three conditions that send a
# package back to cargo, uv or pnpm instead.
homebrew_tools:
    - asciinema
    - atuin
    - bash
    - bat
    - bottom
    - cargo-outdated
    - cargo-update
    - coreutils
    - diffutils
    - diskonaut
    - dotnet
    - dust
    - duti
    - exiftool
    - eza
    - fd
    - ffmpeg
    - findutils
    - fzf
    - gawk
    - gh
    - git
    - git-delta
    - git-lfs
    - gitleaks
    - gnu-sed
    - graphviz
    - grep
    - jq
    - just
    - lazygit
    - lefthook
    - less
    - lychee
    - make
    - markdownlint-cli2
    - miller
    - nuget
    - osv-scanner
    - pandoc
    - pnpm
    - poppler
    - ripgrep
    - ripgrep-all
    - rsync
    - shellcheck
    - shfmt
    - starship
    - svgo
    - taplo
    - tlrc
    - upx
    - vale
    - wasm-pack
    - yq
    - zoxide
    - zsh-autocomplete
    - zsh-autosuggestions
    - zsh-syntax-highlighting
