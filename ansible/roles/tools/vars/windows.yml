---
# Windows installs from WinGet alone — the cargo, uv and pnpm tasks in the
# runtimes role all skip this platform — so anything WinGet does not carry is
# simply absent here. That accounts for the gaps against darwin.yml: the bats
# suite is bash-only, clang-format arrives inside the Visual Studio build
# tools below, and pinact, rtk, sqlfluff, stylelint, promptfoo, wabt, websocat
# and zizmor have no WinGet manifest. `just diff` on the Windows box lists what
# is genuinely missing rather than leaving the difference undocumented.
winget_tools:
    - ajeetdsouza.zoxide
    - ArtifexSoftware.GhostScript
    - BurntSushi.ripgrep.MSVC
    - Casey.Just
    - Clement.bottom
    - Cppcheck.Cppcheck
    - dandavison.delta
    - errata-ai.Vale
    - evilmartians.lefthook
    - eza-community.eza
    - GitHub.cli
    - GitHub.GitLFS
    - Gitleaks.Gitleaks
    - Graphviz.Graphviz
    - Gyan.FFmpeg
    - ImageMagick.ImageMagick
    - JesseDuffield.lazygit
    - jftuga.less
    - johnkerl.miller
    - JohnMacFarlane.Pandoc
    - jqlang.jq
    - junegunn.fzf
    - koalaman.shellcheck
    - lycheeverse.lychee
    - Microsoft.NuGet
    - Microsoft.VisualStudio.2022.BuildTools
    - MikeFarah.yq
    - mvdan.shfmt
    - OliverBetz.ExifTool
    - Ollama.Ollama
    - pnpm.pnpm
    - PuTTY.PuTTY
    - rhysd.actionlint
    - sharkdp.bat
    - sharkdp.fd
    - sharkdp.hyperfine
    - Starship.Starship
    - UPX.UPX
    - XAMPPRocky.tokei
