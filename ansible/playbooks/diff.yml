---
# Run through `just diff`, which sets the stdout callback the report needs.
- name: Diff declared packages against installed ones
  hosts: localhost
  gather_facts: true

  vars:
      diff_ignored:
          darwin:
              # The runtimes role installs both.
              homebrew_formulae:
                  - nvm
                  - uv
              # microsoft-auto-update arrives as a dependency of Edge and
              # Teams. Homebrew resolves the superseded linear-linear token
              # to `linear`, so declaring it installs the app twice.
              homebrew_casks:
                  - linear-linear
                  - microsoft-auto-update
          debian:
              apt: []
              snap: []
              flatpak: []
          windows:
              winget: []
          # The runtimes role installs cargo-binstall from the upstream script.
          cargo:
              - cargo-binstall
          uv: []
          pnpm: []
          vscode: []

  tasks:
      - name: Set effective platform
        ansible.builtin.set_fact:
            effective_platform: >-
                {{ 'windows'
                   if (ansible_env.WSL_DISTRO_NAME is defined or 'microsoft' in ansible_kernel | lower)
                   else ansible_os_family | lower }}

      - name: Load platform tool vars
        ansible.builtin.include_vars:
            file: "{{ repo_root }}/ansible/roles/tools/vars/{{ effective_platform }}.yml"

      - name: Load platform app vars
        ansible.builtin.include_vars:
            file: "{{ repo_root }}/ansible/roles/apps/vars/{{ effective_platform }}.yml"

      # Every probe sets failed_when: false, so a manager this machine lacks
      # leaves its section empty rather than ending the run.
      - name: List Homebrew formulae installed on request
        ansible.builtin.command: brew leaves --installed-on-request
        register: probe_brew_formulae
        changed_when: false
        failed_when: false
        when: effective_platform == "darwin"

      # `brew leaves` answers the undeclared side. A declared formula another
      # depends on drops out of it, so this full list answers the missing side.
      - name: List every installed Homebrew formula
        ansible.builtin.command: brew list --formula
        register: probe_brew_all
        changed_when: false
        failed_when: false
        when: effective_platform == "darwin"

      - name: List Homebrew casks
        ansible.builtin.command: brew list --cask
        register: probe_brew_casks
        changed_when: false
        failed_when: false
        when: effective_platform == "darwin"

      # `apt-mark showmanual` includes the base system, so subtract the set the
      # installer recorded at first boot.
      - name: List apt packages added since installation
        ansible.builtin.shell: |
            set -o pipefail
            if [ -r /var/log/installer/initial-status.gz ]; then
                comm -23 <(apt-mark showmanual | sort) \
                         <(gzip -dc /var/log/installer/initial-status.gz | sed -n 's/^Package: //p' | sort)
            else
                apt-mark showmanual | sort
            fi
        args:
            executable: /bin/bash
        register: probe_apt
        changed_when: false
        failed_when: false
        when: effective_platform == "debian"

      - name: List snap packages
        ansible.builtin.shell: |
            set -o pipefail
            snap list | awk 'NR > 1 {print $1}'
        args:
            executable: /bin/bash
        register: probe_snap
        changed_when: false
        failed_when: false
        when: effective_platform == "debian"

      - name: List flatpak applications
        ansible.builtin.command: flatpak list --app --columns=application
        register: probe_flatpak
        changed_when: false
        failed_when: false
        when: effective_platform == "debian"

      # `winget list` prints a table that reflows with the terminal width. The
      # export does not.
      - name: Ensure the scratch directory exists for the WinGet export
        ansible.builtin.file:
            path: "{{ repo_root }}/tmp"
            state: directory
            mode: "0755"
        when: effective_platform == "windows"

      - name: Export the WinGet package list
        ansible.builtin.command: winget export --output {{ repo_root }}/tmp/winget-export.json --source winget --accept-source-agreements
        register: probe_winget_export
        changed_when: false
        failed_when: false
        when: effective_platform == "windows"

      - name: Read the exported WinGet package list
        ansible.builtin.slurp:
            src: "{{ repo_root }}/tmp/winget-export.json"
        register: probe_winget
        failed_when: false
        when: effective_platform == "windows"

      - name: List cargo crates
        ansible.builtin.command: cargo install --list
        register: probe_cargo
        changed_when: false
        failed_when: false
        environment:
            PATH: "{{ cargo_bin }}:{{ ansible_env.PATH }}"
        when: effective_platform != "windows"

      - name: List uv tools
        ansible.builtin.command: uv tool list
        register: probe_uv
        changed_when: false
        failed_when: false
        environment:
            PATH: "{{ homebrew_bin }}:{{ local_bin }}:{{ ansible_env.PATH }}"
        when: effective_platform != "windows"

      - name: List global pnpm packages
        ansible.builtin.command: pnpm list -g --depth 0
        register: probe_pnpm
        changed_when: false
        failed_when: false
        environment:
            PATH: "{{ homebrew_bin }}:{{ pnpm_bin }}:{{ ansible_env.PATH }}"
            PNPM_HOME: "{{ pnpm_home }}"
        when: effective_platform != "windows"

      - name: List VS Code extensions
        ansible.builtin.command: code --list-extensions
        register: probe_vscode
        changed_when: false
        failed_when: false

      # pnpm prints tree glyphs before each `name@version`.
      - name: Normalise installed package names
        ansible.builtin.set_fact:
            installed_cargo: >-
                {{ probe_cargo.stdout | default('') | regex_findall('(?m)^(\S+) v[0-9]') }}
            installed_uv: >-
                {{ probe_uv.stdout | default('') | regex_findall('(?m)^(\S+) v[0-9]') }}
            installed_pnpm: >-
                {{ probe_pnpm.stdout | default('') | regex_findall('(?m)^(?:\W+\s)?(\S+)@[0-9]') }}
            installed_vscode: "{{ probe_vscode.stdout_lines | default([]) }}"
            installed_winget: >-
                {{ (probe_winget.content | default('') | b64decode | from_json).Sources
                   | default([]) | map(attribute='Packages') | flatten
                   | map(attribute='PackageIdentifier') | list
                   if effective_platform == 'windows' and probe_winget.content is defined
                   else [] }}

      # Homebrew reports a tapped formula fully qualified, so strip everything
      # before the last slash to match the bare name in the vars files.
      - name: Assemble macOS sections
        ansible.builtin.set_fact:
            diff_sources: >-
                {{ [
                     {'title': 'Homebrew formulae',
                      'hint': 'roles/tools/vars/darwin.yml → homebrew_tools',
                      'declared': homebrew_tools,
                      'installed': probe_brew_formulae.stdout_lines | default([]) | map('regex_replace', '^.*/', '') | list,
                      'present': probe_brew_all.stdout_lines | default([]) | map('regex_replace', '^.*/', '') | list,
                      'ignored': diff_ignored.darwin.homebrew_formulae},
                     {'title': 'Homebrew casks',
                      'hint': 'roles/apps/vars/darwin.yml → homebrew_casks',
                      'declared': homebrew_casks,
                      'installed': probe_brew_casks.stdout_lines | default([]) | map('regex_replace', '^.*/', '') | list,
                      'ignored': diff_ignored.darwin.homebrew_casks},
                   ] }}
        when: effective_platform == "darwin"

      - name: Assemble Ubuntu sections
        ansible.builtin.set_fact:
            diff_sources: >-
                {{ [
                     {'title': 'apt packages',
                      'hint': 'roles/tools/vars/debian.yml → apt_tools',
                      'declared': apt_tools,
                      'installed': probe_apt.stdout_lines | default([]),
                      'ignored': diff_ignored.debian.apt},
                     {'title': 'snap packages',
                      'hint': 'roles/tools/vars/debian.yml → snap_tools, roles/apps/vars/debian.yml → snap_apps',
                      'declared': (snap_tools | map(attribute='name') | list)
                                  + (snap_apps | map(attribute='name') | list),
                      'installed': probe_snap.stdout_lines | default([]),
                      'ignored': diff_ignored.debian.snap},
                     {'title': 'flatpak applications',
                      'hint': 'roles/apps/vars/debian.yml → flatpak_apps',
                      'declared': flatpak_apps | map(attribute='name') | list,
                      'installed': probe_flatpak.stdout_lines | default([]) | reject('equalto', 'Application ID') | list,
                      'ignored': diff_ignored.debian.flatpak},
                   ] }}
        when: effective_platform == "debian"

      - name: Assemble Windows sections
        ansible.builtin.set_fact:
            diff_sources: >-
                {{ [
                     {'title': 'WinGet packages',
                      'hint': 'roles/tools/vars/windows.yml → winget_tools, roles/apps/vars/windows.yml → winget_apps',
                      'declared': winget_tools + winget_apps,
                      'installed': installed_winget,
                      'ignored': diff_ignored.windows.winget},
                   ] }}
        when: effective_platform == "windows"

      # The declared expressions mirror the platform split in
      # roles/runtimes/tasks/main.yml.
      - name: Append runtime-manager sections
        ansible.builtin.set_fact:
            diff_sources: >-
                {{ diff_sources | default([]) + [
                     {'title': 'cargo crates',
                      'hint': 'group_vars/all.yml → cargo_packages*',
                      'declared': cargo_packages
                                  + (cargo_packages_non_darwin if effective_platform != 'darwin' else [])
                                  + (cargo_packages_debian if effective_platform == 'debian' else []),
                      'installed': installed_cargo,
                      'ignored': diff_ignored.cargo},
                     {'title': 'uv tools',
                      'hint': 'group_vars/all.yml → pip_packages*',
                      'declared': pip_packages
                                  + (pip_packages_non_darwin if effective_platform != 'darwin' else []),
                      'installed': installed_uv,
                      'ignored': diff_ignored.uv},
                     {'title': 'pnpm globals',
                      'hint': 'group_vars/all.yml → pnpm_packages*',
                      'declared': pnpm_packages
                                  + (pnpm_packages_non_darwin if effective_platform != 'darwin' else []),
                      'installed': installed_pnpm,
                      'ignored': diff_ignored.pnpm},
                   ] }}
        when: effective_platform != "windows"

      - name: Append the VS Code extension section
        ansible.builtin.set_fact:
            diff_sources: >-
                {{ diff_sources | default([]) + [
                     {'title': 'VS Code extensions',
                      'hint': 'group_vars/all.yml → vscode_extensions',
                      'declared': vscode_extensions,
                      'installed': installed_vscode,
                      'ignored': diff_ignored.vscode},
                   ] }}

      - name: Render the report
        ansible.builtin.debug:
            msg: |
              {% set undeclared_total = [] %}
              ══════════════════════════════════════════════════════════════════
               Package diff — {{ effective_platform }}
              ══════════════════════════════════════════════════════════════════
              {% for source in diff_sources %}
              {% set present = source.present | default(source.installed) %}
              {% set undeclared = source.installed | difference(source.declared) | difference(source.ignored) | sort %}
              {% set missing = source.declared | difference(present) | sort %}
              {% set _ = undeclared_total.extend(undeclared) %}

              ▸ {{ source.title }} — {{ source.declared | length }} declared, {{ source.installed | length }} installed
              {% if undeclared %}
                  Installed but NOT declared ({{ undeclared | length }}) — add to {{ source.hint }}
              {% for name in undeclared %}
                      {{ name }}
              {% endfor %}
              {% else %}
                  Installed but NOT declared: none
              {% endif %}
              {% if missing %}
                  Declared but NOT installed ({{ missing | length }}) — `just install` would add these
              {% for name in missing %}
                      {{ name }}
              {% endfor %}
              {% else %}
                  Declared but NOT installed: none
              {% endif %}
              {% endfor %}

              ──────────────────────────────────────────────────────────────────
               {{ undeclared_total | length }} undeclared package(s) across {{ diff_sources | length }} managers.
              {% if effective_platform == 'debian' and probe_apt.stdout is defined %}
               apt figures exclude the base system where /var/log/installer is
               readable; otherwise they include it and will look inflated.
              {% endif %}
              ──────────────────────────────────────────────────────────────────
