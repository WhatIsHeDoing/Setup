---
- name: Verify desktop setup
  hosts: localhost
  gather_facts: true

  pre_tasks:
      # `always` so tag-filtered runs still set the fact every task depends on.
      - name: Set effective platform
        ansible.builtin.set_fact:
            effective_platform: "{{ 'windows' if (ansible_env.WSL_DISTRO_NAME is defined or 'microsoft' in ansible_kernel | lower) else ansible_os_family | lower }}"
        tags: [always]

  vars:
      tools_to_verify:
          - cmd: "git --version"
            name: "git"
          - cmd: "just --version"
            name: "just"
          - cmd: "uv --version"
            name: "uv"
          - cmd: "fzf --version"
            name: "fzf"
          - cmd: "bat --version"
            name: "bat"
          - cmd: "eza --version"
            name: "eza"
          - cmd: "rg --version"
            name: "ripgrep"
          - cmd: "jq --version"
            name: "jq"
          - cmd: "starship --version"
            name: "starship"
          - cmd: "cargo --version"
            name: "cargo"
          - cmd: "dotnet --version"
            name: "dotnet"
          - cmd: "pnpm --version"
            name: "pnpm"
          - cmd: "uv python list"
            name: "uv-python"
          - cmd: "gh --version"
            name: "gh"
          - cmd: "git-lfs --version"
            name: "git-lfs"
          - cmd: "lazygit --version"
            name: "lazygit"
          - cmd: "lefthook version"
            name: "lefthook"
          - cmd: "mlr --version"
            name: "miller"
          - cmd: "fd --version"
            name: "fd"
          - cmd: "ffmpeg -version"
            name: "ffmpeg"
          - cmd: "delta --version"
            name: "delta"
          - cmd: "btm --version"
            name: "bottom"
          - cmd: "yq --version"
            name: "yq"
          - cmd: "zoxide --version"
            name: "zoxide"
          - cmd: "shellcheck --version"
            name: "shellcheck"
          - cmd: "sd --version"
            name: "sd"
          - cmd: "rga --version"
            name: "ripgrep-all"
          - cmd: "atuin --version"
            name: "atuin"
          - cmd: "cargo cache --version"
            name: "cargo-cache"
          - cmd: "cargo outdated --version"
            name: "cargo-outdated"
          - cmd: "cargo install-update --version"
            name: "cargo-update"
          - cmd: "diskonaut --version"
            name: "diskonaut"
          - cmd: "wasm-pack --version"
            name: "wasm-pack"
          - cmd: "claude --version"
            name: "claude-code"
          - cmd: "dust --version"
            name: "dust"
          - cmd: "tldr --version"
            name: "tlrc"
          - cmd: "exiftool -ver"
            name: "exiftool"
          - cmd: "dot -V"
            name: "graphviz"
          - cmd: "markdownlint-cli2 --version"
            name: "markdownlint-cli2"
          - cmd: "pdfinfo -v"
            name: "poppler"
          - cmd: "shfmt --version"
            name: "shfmt"
          - cmd: "svgo --version"
            name: "svgo"
          - cmd: "vale --version"
            name: "vale"
          - cmd: "gitleaks version"
            name: "gitleaks"
          - cmd: "taplo --version"
            name: "taplo"
          - cmd: "lychee --version"
            name: "lychee"
          - cmd: "zsh --version"
            name: "zsh"
          # bats-assert and bats-support ship no executable, so nothing here can
          # check them.
          - cmd: "bats --version"
            name: "bats-core"
          - cmd: "clang-format --version"
            name: "clang-format"
          - cmd: "cppcheck --version"
            name: "cppcheck"
          - cmd: "cspell --version"
            name: "cspell"
          - cmd: "git-filter-repo --version"
            name: "git-filter-repo"
          - cmd: "gs --version"
            name: "ghostscript"
          - cmd: "hyperfine --version"
            name: "hyperfine"
          - cmd: "magick --version"
            name: "imagemagick"
          - cmd: "jupyter-lab --version"
            name: "jupyterlab"
          - cmd: "jupyter kernelspec list"
            name: "jupyter-kernel"
          - cmd: "promptfoo --version"
            name: "promptfoo"
          - cmd: "sqlfluff --version"
            name: "sqlfluff"
          - cmd: "stylelint --version"
            name: "stylelint"
          - cmd: "tokei --version"
            name: "tokei"
          - cmd: "wasm2wat --version"
            name: "wabt"
          - cmd: "websocat --version"
            name: "websocat"
          - cmd: "yamllint --version"
            name: "yamllint"
          - cmd: "zizmor --version"
            name: "zizmor"

      darwin_tools_to_verify:
          - cmd: "bash --version"
            name: "bash"
          - cmd: "gcp --version"
            name: "coreutils"
          - cmd: "diff --version"
            name: "diffutils"
          - cmd: "gfind --version"
            name: "findutils"
          - cmd: "gawk --version"
            name: "gawk"
          - cmd: "gsed --version"
            name: "gnu-sed"
          - cmd: "ggrep --version"
            name: "grep"
          - cmd: "less --version"
            name: "less"
          - cmd: "gmake --version"
            name: "make"
          - cmd: "rsync --version"
            name: "rsync"

      darwin_only_tools_to_verify:
          - cmd: "actionlint --version"
            name: "actionlint"
          - cmd: "ollama --version"
            name: "ollama"
          - cmd: "pinact --version"
            name: "pinact"
          - cmd: "rtk --version"
            name: "rtk"

      darwin_path_precedence:
          - bash
          - diff
          - git
          - jq
          - less
          - rsync

      windows_tools_to_verify:
          - cmd: "git --version"
            name: "git"
          - cmd: "just --version"
            name: "just"
          - cmd: "fzf --version"
            name: "fzf"
          - cmd: "bat --version"
            name: "bat"
          - cmd: "eza --version"
            name: "eza"
          - cmd: "rg --version"
            name: "ripgrep"
          - cmd: "jq --version"
            name: "jq"
          - cmd: "starship --version"
            name: "starship"
          - cmd: "node --version"
            name: "node"
          - cmd: "python --version"
            name: "python"
          - cmd: "cargo --version"
            name: "cargo"
          - cmd: "pnpm --version"
            name: "pnpm"
          - cmd: "dotnet --version"
            name: "dotnet"
          - cmd: "dotnet --list-runtimes"
            name: "dotnet-runtimes"
          - cmd: "pwsh --version"
            name: "powershell"
          - cmd: "gh --version"
            name: "gh"
          - cmd: "git-lfs --version"
            name: "git-lfs"
          - cmd: "lazygit --version"
            name: "lazygit"
          - cmd: "lefthook version"
            name: "lefthook"
          - cmd: "mlr --version"
            name: "miller"
          - cmd: "fd --version"
            name: "fd"
          - cmd: "ffmpeg -version"
            name: "ffmpeg"
          - cmd: "delta --version"
            name: "delta"
          - cmd: "btm --version"
            name: "bottom"
          - cmd: "yq --version"
            name: "yq"
          - cmd: "zoxide --version"
            name: "zoxide"
          - cmd: "shellcheck --version"
            name: "shellcheck"
          - cmd: "sd --version"
            name: "sd"
          - cmd: "rga --version"
            name: "ripgrep-all"
          - cmd: "exiftool -ver"
            name: "exiftool"
          - cmd: "dot -V"
            name: "graphviz"
          - cmd: "shfmt --version"
            name: "shfmt"
          - cmd: "vale --version"
            name: "vale"
          - cmd: "gitleaks version"
            name: "gitleaks"
          - cmd: "lychee --version"
            name: "lychee"
          - cmd: "actionlint --version"
            name: "actionlint"
          - cmd: "cppcheck --version"
            name: "cppcheck"
          # Ghostscript names its Windows console binary gswin64c.
          - cmd: "gswin64c --version"
            name: "ghostscript"
          - cmd: "hyperfine --version"
            name: "hyperfine"
          - cmd: "magick --version"
            name: "imagemagick"
          - cmd: "ollama --version"
            name: "ollama"
          - cmd: "tokei --version"
            name: "tokei"

      dotfiles_to_verify:
          - path: "{{ ansible_env.HOME }}/.config/atuin/config.toml"
            name: "atuin config"
          - path: "{{ ansible_env.HOME }}/.config/bat/config"
            name: "bat config"
          - path: "{{ ansible_env.HOME }}/.config/bottom/bottom.toml"
            name: "bottom config"
          - path: "{{ ansible_env.HOME }}/Library/Application Support/com.mitchellh.ghostty/config"
            name: "ghostty config"
          - path: "{{ ansible_env.HOME }}/.gitignore_global"
            name: "global gitignore"
          - path: "{{ ansible_env.HOME }}/.config/ripgrep/rc"
            name: "ripgrep config"
          - path: "{{ ansible_env.HOME }}/.config/starship.toml"
            name: "starship config"
          - path: "{{ ansible_env.HOME }}/.config/zsh/00-path.zsh"
            name: "zsh PATH fragment"
          - path: "{{ ansible_env.HOME }}/.config/zsh/99-local.zsh"
            name: "zsh local override"

  tasks:
      - name: Verify tool is installed and functional
        ansible.builtin.command: "{{ item.cmd }}"
        loop: "{{ tools_to_verify }}"
        loop_control:
            label: "{{ item.name }}"
        register: verify_results
        changed_when: false
        environment:
            PATH: "{{ cargo_bin }}:{{ homebrew_bin }}:{{ local_bin }}:/snap/bin:{{ ansible_env.PATH }}"
        when: effective_platform != "windows"

      - name: Print verified versions
        ansible.builtin.debug:
            msg: "OK {{ item.item.name }}: {{ (item.stdout_lines + item.stderr_lines) | first | default('?') }}"
        loop: "{{ verify_results.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when: effective_platform != "windows"

      - name: Verify macOS override tool is installed and functional
        ansible.builtin.command: "{{ item.cmd }}"
        loop: "{{ darwin_tools_to_verify }}"
        loop_control:
            label: "{{ item.name }}"
        register: darwin_verify_results
        changed_when: false
        environment:
            PATH: "{{ homebrew_bin }}:{{ ansible_env.PATH }}"
        when: effective_platform == "darwin"

      - name: Print verified macOS override versions
        ansible.builtin.debug:
            msg: "OK {{ item.item.name }}: {{ (item.stdout_lines + item.stderr_lines) | first | default('?') }}"
        loop: "{{ darwin_verify_results.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when: effective_platform == "darwin"

      - name: Verify macOS-only tool is installed and functional
        ansible.builtin.command: "{{ item.cmd }}"
        loop: "{{ darwin_only_tools_to_verify }}"
        loop_control:
            label: "{{ item.name }}"
        register: darwin_only_verify_results
        changed_when: false
        environment:
            PATH: "{{ homebrew_bin }}:{{ ansible_env.PATH }}"
        when: effective_platform == "darwin"

      - name: Print verified macOS-only versions
        ansible.builtin.debug:
            msg: "OK {{ item.item.name }}: {{ (item.stdout_lines + item.stderr_lines) | first | default('?') }}"
        loop: "{{ darwin_only_verify_results.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when: effective_platform == "darwin"

      - name: Resolve override tools in a login shell
        ansible.builtin.command: "zsh -l -c 'command -v {{ item }}'"
        loop: "{{ darwin_path_precedence }}"
        loop_control:
            label: "{{ item }}"
        register: darwin_precedence_results
        changed_when: false
        when: effective_platform == "darwin"

      - name: Assert Homebrew wins over the macOS copy
        ansible.builtin.assert:
            that: (item.stdout | trim | dirname) == homebrew_bin
            fail_msg: >-
                {{ item.item }} resolves to {{ item.stdout | trim }}, not {{ homebrew_bin }}.
                PATH ordering has regressed — check the managed block in ~/.zprofile.
            success_msg: "OK {{ item.item }}: {{ item.stdout | trim }}"
        loop: "{{ darwin_precedence_results.results }}"
        loop_control:
            label: "{{ item.item }}"
        when: effective_platform == "darwin"

      # playbook_dir rather than repo_root: `just verify` runs this playbook
      # alone, with no extra vars.
      - name: Probe the emoji picker skin-tone defaults
        ansible.builtin.command: >-
            python3 {{ playbook_dir }}/../roles/os_config/files/set_emoji_skin_tone.py
            --tone {{ macos_emoji_skin_tone }} --check
        register: emoji_skin_tone_probe
        changed_when: false
        when:
            - effective_platform == "darwin"
            - macos_emoji_skin_tone | length > 0

      - name: Assert every emoji carries the configured skin tone
        ansible.builtin.assert:
            that: emoji_skin_tone_probe.stdout.startswith("OK")
            fail_msg: >-
                {{ emoji_skin_tone_probe.stdout }}. Re-run the install playbook; if the
                drift survives that, macOS has probably changed where the picker keeps
                skin tones and set_emoji_skin_tone.py needs revisiting.
            success_msg: "{{ emoji_skin_tone_probe.stdout }}"
        when:
            - effective_platform == "darwin"
            - macos_emoji_skin_tone | length > 0

      # TERM is pinned: zsh-autocomplete binds keys only when terminfo
      # describes a usable terminal, and a bare Ansible run has none. `-i`
      # without a terminal makes zsh complain about zle on stderr; the
      # bindings still register.
      - name: Probe the assembled zsh configuration
        ansible.builtin.shell: |
            TERM=xterm-256color zsh -i -l -c '
                print "ctrl_r=$(bindkey "^R")"
                print "ctrl_t=$(bindkey "^T")"
                print "alt_c=$(bindkey "\ec")"
                print "autosuggest=${+functions[_zsh_autosuggest_start]}"
                print "highlight=${ZSH_HIGHLIGHT_HIGHLIGHTERS:-none}"
                print "autocomplete=${+_autocomplete__funcfiletrace}"
            ' 2>/dev/null
        args:
            executable: /bin/bash
        register: zsh_probe
        changed_when: false
        when: effective_platform != "windows"

      - name: Assert the zsh configuration assembled correctly
        ansible.builtin.assert:
            that:
                - "'ctrl_r=\"^R\" atuin-search' in zsh_probe.stdout"
                - "'ctrl_t=\"^T\" fzf-file-widget' in zsh_probe.stdout"
                - "'alt_c=\"^[c\" fzf-cd-widget' in zsh_probe.stdout"
                - "'autosuggest=1' in zsh_probe.stdout"
                - "'highlight=none' not in zsh_probe.stdout"
                - "'autocomplete=1' in zsh_probe.stdout"
            fail_msg: >-
                The assembled zsh config is wrong. Probe returned:
                {{ zsh_probe.stdout | trim | default('nothing', true) }}.
                A missing plugin means it resolved under no prefix
                45-autocomplete.zsh searches; a default keybinding
                (history-incremental-search-backward, transpose-chars) means a
                plugin reset the keymap after the tool bound it, so check the
                fragment load order.
            success_msg: "OK zsh config: plugins loaded, fzf and atuin keybindings intact"
        when: effective_platform != "windows"

      - name: Verify Node.js is installed via nvm
        ansible.builtin.shell: |
            . /opt/homebrew/opt/nvm/nvm.sh 2>/dev/null || . ~/.nvm/nvm.sh 2>/dev/null
            node --version
        args:
            executable: /bin/bash
        register: node_version
        changed_when: false
        failed_when: node_version.rc != 0
        when: effective_platform != "windows"

      - name: Print Node.js version
        ansible.builtin.debug:
            msg: "OK node: {{ node_version.stdout_lines[0] }}"
        when: effective_platform != "windows"

      - name: Verify dotfiles are deployed
        ansible.builtin.stat:
            path: "{{ item.path }}"
        register: dotfile_stats
        loop: "{{ dotfiles_to_verify }}"
        loop_control:
            label: "{{ item.name }}"
        when: effective_platform != "windows"

      - name: Assert dotfiles are present
        ansible.builtin.assert:
            that: item.stat.exists
            fail_msg: "{{ item.item.name }} not found at {{ item.item.path }}"
            success_msg: "OK {{ item.item.name }}: present"
        loop: "{{ dotfile_stats.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when: effective_platform != "windows"

      - name: Verify global gitignore is configured # noqa: command-instead-of-module
        ansible.builtin.command: git config --global core.excludesfile
        register: git_excludes
        changed_when: false
        failed_when: git_excludes.rc != 0
        when: effective_platform != "windows"

      - name: Print global gitignore path
        ansible.builtin.debug:
            msg: "OK git: core.excludesfile = {{ git_excludes.stdout | trim }}"
        when: effective_platform != "windows"

      - name: Verify scripts are deployed and executable
        ansible.builtin.stat:
            path: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
        register: script_stats
        loop:
            - ff
            - ll
        when: effective_platform != "windows"

      - name: Assert scripts are executable
        ansible.builtin.assert:
            that:
                - item.stat.exists
                - item.stat.executable
            fail_msg: "{{ item.item }} not found or not executable at ~/.local/bin/{{ item.item }}"
            success_msg: "OK {{ item.item }}: deployed and executable"
        loop: "{{ script_stats.results }}"
        loop_control:
            label: "{{ item.item }}"
        when: effective_platform != "windows"

      - name: Verify ll runs successfully
        ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/ll ."
        changed_when: false
        register: ll_result
        when: effective_platform != "windows"

      - name: Print ll result
        ansible.builtin.debug:
            msg: "OK ll: listed {{ ll_result.stdout_lines | length }} lines"
        when: effective_platform != "windows"

      - name: Verify Windows tool is installed and functional
        ansible.builtin.shell: 'powershell.exe -NoProfile -Command "{{ item.cmd }}" 2>/dev/null' # noqa: risky-shell-pipe
        loop: "{{ windows_tools_to_verify }}"
        loop_control:
            label: "{{ item.name }}"
        register: windows_verify_results
        changed_when: false
        failed_when: false
        environment:
            PATH: "/mnt/c/Windows/System32/WindowsPowerShell/v1.0:/mnt/c/Windows/System32:{{ ansible_env.PATH }}"
        when: effective_platform == "windows"

      - name: Print verified Windows versions
        ansible.builtin.debug:
            msg: "{{ 'OK' if item.rc == 0 else 'MISSING' }} {{ item.item.name }}{{ ': ' + item.stdout_lines[0] if item.stdout_lines else '' }}"
        loop: "{{ windows_verify_results.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when: effective_platform == "windows"

      - name: Reminder about git signing
        ansible.builtin.debug:
            msg: |
                Git signing is not managed by this setup.
                To enable SSH signing, run:
                  git config --global gpg.format ssh
                  git config --global user.signingkey ~/.ssh/<key>.pub
                  git config --global commit.gpgsign true
