---
# Git configuration applied on all platforms
git_config:
    # Delete local branches whose upstream has been removed (e.g. after
    # the remote head branch was auto-deleted post-merge). Safe to run
    # repeatedly: no-op when nothing is gone.
    alias.cleanup-gone: "!git branch -vv | awk '/: gone]/{print $1}' | xargs -r git branch -D"
    branch.sort: "-committerdate"
    column.ui: "auto"
    commit.verbose: "true"
    core.excludesFile: "~/.gitignore_global"
    core.pager: "delta"
    delta.navigate: "true"
    delta.dark: "true"
    diff.algorithm: "histogram"
    diff.colorMoved: "default"
    fetch.prune: "true"
    fetch.pruneTags: "true"
    help.autocorrect: "prompt"
    init.defaultBranch: "main"
    interactive.diffFilter: "delta --color-only"
    merge.conflictstyle: "zdiff3"
    pull.rebase: "false"
    push.autoSetupRemote: "true"
    push.default: "current"
    push.followTags: "true"
    rebase.autosquash: "true"
    rebase.autostash: "true"
    rerere.enabled: "true"
    tag.sort: "version:refname"

# ── Shell / PATH fragments ───────────────────────────────────────────────
# Reused wherever a task invokes a freshly installed tool before a new shell
# picks it up on PATH. The Homebrew prefix follows the CPU — Apple Silicon
# under /opt/homebrew, Intel Macs under /usr/local — matching the dual check
# in roles/bootstrap/tasks/darwin.yml. Vars are evaluated lazily, so the
# Linux-irrelevant Homebrew paths never resolve on Debian/Windows.
homebrew_prefix: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}"
homebrew_bin: "{{ homebrew_prefix }}/bin"
cargo_bin: "{{ ansible_env.HOME }}/.cargo/bin"
local_bin: "{{ ansible_env.HOME }}/.local/bin"
pnpm_home: "{{ ansible_env.HOME }}/.local/share/pnpm"
pnpm_bin: "{{ pnpm_home }}/bin"

# Location of nvm.sh to source — a Homebrew keg on macOS, ~/.nvm on Linux.
# Keyed on ansible_os_family so it resolves in both install and upgrade plays
# (the upgrade play does not set effective_platform).
nvm_sh: "{{ (homebrew_prefix ~ '/opt/nvm/nvm.sh') if ansible_os_family == 'Darwin' else (ansible_env.HOME ~ '/.nvm/nvm.sh') }}"

# Cargo, uv and pnpm are the fallback for packages no OS manager carries, or
# carries well enough — see ADR-0010. Everything Homebrew, apt or WinGet ships
# at upstream parity lives in the per-platform tools vars instead, which is why
# these lists are mostly platform-suffixed: the same package often comes from
# Homebrew on macOS and cargo on Debian.

# No OS manager anywhere ships these, so every platform builds them from cargo
# (via cargo-binstall — prebuilt binaries where available, falling back to a
# source build otherwise).
cargo_packages:
    - cargo-modules

# Homebrew carries these at upstream parity, so macOS takes them from
# roles/tools/vars/darwin.yml, and apt has none of them bar sd. Ubuntu noble
# ships sd 1.0.0, and upstream 1.1.0 changed the default from whole-file to
# line-by-line matching, so a multiline replace would behave differently on
# the apt copy; cargo keeps all three platforms on the same release. Both
# print `sd 1.0.0` from --version, because the 1.1.0 tag never bumped its
# crate version, so look for --across in --help to tell them apart. In
# practice this list is Debian-only: the cargo tasks in the runtimes role skip
# Windows, which takes sd and tokei from WinGet and simply goes without the
# rest.
cargo_packages_non_darwin:
    - cargo-cache
    - cargo-outdated
    - cargo-update
    - diskonaut
    - ripgrep_all
    - sd
    - tokei
    - wasm-pack
    - websocat
    - zizmor

# Debian is the only gap for these: macOS takes them from Homebrew and Windows
# from WinGet, both at parity. atuin also has no reason to exist on Windows —
# nothing there runs the zsh config that binds Ctrl-R to it.
cargo_packages_debian:
    - atuin
    - bottom

# Python tools installed on all platforms via uv tool install. Homebrew is at
# parity for ansible-lint and commitizen, but uv owns Python tooling under
# ADR-0006 and neither is worth a second install path. checkov shipped 43
# releases in 180 days and Homebrew trails by nine; ansible-core and ipykernel
# have no formula at all. See ADR-0010.
pip_packages:
    - ansible-core
    - ansible-lint
    - checkov
    - commitizen

# macOS takes these from Homebrew instead — see tools/vars/darwin.yml. The
# yamllint formula depends on python@3.14, which the old comment here treated
# as disqualifying; that interpreter is already on every macOS machine this
# repo builds, because nuget, ollama and sqlfluff in homebrew_tools each depend
# on it too. Neither apt nor WinGet ships any of the three, and the uv tasks
# skip Windows, so this list is Debian-only in practice.
#
# jupyterlab replaced a bare `ipykernel` entry that could never have worked:
# ipykernel ships no executable, so `uv tool install ipykernel` exits with
# "No executables are provided" and the task's failed_when: false swallowed it
# on every run since. A kernel is a library a front end imports, not a tool —
# so install the front end and let it bring the kernel. jupyterlab depends on
# ipykernel>=6.5.0, and its kernelspec resolves out of the same environment,
# which is why no separate `ipykernel install` step is needed on either
# platform.
pip_packages_non_darwin:
    - jupyterlab
    - sqlfluff
    - yamllint

# Skin tone the macOS emoji picker offers by default: light, medium-light,
# medium, medium-dark or dark. Set it to "" to leave the picker alone.
#
# macOS has no global setting for this — the picker learns a tone per emoji as
# you use it — so roles/os_config seeds the same choice for all 323 emoji that
# accept a modifier. Ignored on Debian and Windows, which have no such picker.
macos_emoji_skin_tone: light

# Claude Code MCP servers configured at user scope
mcp_servers:
    - name: cloudflare
      command: npx @cloudflare/mcp-server-cloudflare
    - name: context7
      command: npx @upstash/context7-mcp
    - name: github
      command: npx @modelcontextprotocol/server-github
    - name: playwright
      command: npx @playwright/mcp@latest

# pnpm packages installed globally on every platform. Empty today — cspell was
# the only entry and macOS now takes it from Homebrew — but kept so a genuinely
# cross-platform package has an obvious home, and so the install task keeps the
# same shape as the cargo one above.
pnpm_packages: []

# macOS takes all three from Homebrew instead — see tools/vars/darwin.yml. Each
# formula depends on `node`, which the old comment here read as a conflict with
# the nvm Node that ADR-0006 made authoritative. It is not one: markdownlint-cli2
# and svgo in homebrew_tools already pull that keg in, and config/zsh/00-path.zsh
# puts the nvm shims ahead of the Homebrew prefix, so nvm still wins the `node`
# lookup. Neither apt nor WinGet packages any of them, and the pnpm task skips
# Windows, so this list is Debian-only in practice.
pnpm_packages_non_darwin:
    - cspell
    - promptfoo
    - stylelint

# VS Code extensions installed on all platforms
vscode_extensions:
    - davidanson.vscode-markdownlint
    - eamodio.gitlens
    - editorconfig.editorconfig
    - sdras.night-owl
    - usernamehw.errorlens
    - vscode-icons-team.vscode-icons
