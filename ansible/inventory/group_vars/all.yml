---
git_config:
    alias.cleanup-gone: "!git branch -vv | awk '/: gone]/{print $1}' | xargs -r git branch -D"
    branch.sort: "-committerdate"
    column.ui: "auto"
    commit.verbose: "true"
    core.excludesFile: "~/.gitignore_global"
    core.pager: "delta"
    delta.navigate: "true"
    delta.dark: "true"
    diff.algorithm: "histogram"
    diff.colorMoved: "default"
    fetch.prune: "true"
    fetch.pruneTags: "true"
    help.autocorrect: "prompt"
    init.defaultBranch: "main"
    interactive.diffFilter: "delta --color-only"
    merge.conflictstyle: "zdiff3"
    pull.rebase: "false"
    push.autoSetupRemote: "true"
    push.default: "current"
    push.followTags: "true"
    rebase.autosquash: "true"
    rebase.autostash: "true"
    rerere.enabled: "true"
    tag.sort: "version:refname"

# Ansible evaluates these lazily, so the Homebrew paths never resolve on
# Debian or Windows.
homebrew_prefix: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}"
homebrew_bin: "{{ homebrew_prefix }}/bin"
cargo_bin: "{{ ansible_env.HOME }}/.cargo/bin"
local_bin: "{{ ansible_env.HOME }}/.local/bin"
pnpm_home: "{{ ansible_env.HOME }}/.local/share/pnpm"
pnpm_bin: "{{ pnpm_home }}/bin"

# Keyed on ansible_os_family rather than effective_platform, which the upgrade
# play never sets.
nvm_sh: "{{ (homebrew_prefix ~ '/opt/nvm/nvm.sh') if ansible_os_family == 'Darwin' else (ansible_env.HOME ~ '/.nvm/nvm.sh') }}"

cargo_packages:
    - cargo-modules

# apt ships sd 1.0.0, which matches across lines by default where 1.1.0
# matches per line. Both print 1.0.0 from --version; `--across` in --help
# tells them apart.
cargo_packages_non_darwin:
    - cargo-cache
    - cargo-outdated
    - cargo-update
    - diskonaut
    - ripgrep_all
    - sd
    - tokei
    - wasm-pack
    - websocat
    - zizmor

# atuin stays off Windows, which never runs the zsh config that binds it.
cargo_packages_debian:
    - atuin
    - bottom

pip_packages:
    - ansible-core
    - ansible-lint
    - checkov
    - commitizen

# `uv tool install ipykernel` fails: the package ships no executable.
# jupyterlab brings ipykernel in.
pip_packages_non_darwin:
    - jupyterlab
    - sqlfluff
    - yamllint

# light, medium-light, medium, medium-dark or dark; "" leaves the picker alone.
macos_emoji_skin_tone: light

mcp_servers:
    - name: cloudflare
      command: npx @cloudflare/mcp-server-cloudflare
    - name: context7
      command: npx @upstash/context7-mcp
    - name: github
      command: npx @modelcontextprotocol/server-github
    - name: playwright
      command: npx @playwright/mcp@latest

# npm is the only channel shipping an anydoc CLI: the crates.io crate is a
# library with no binary target, and no OS manager carries it at all.
pnpm_packages:
    - "@firecrawl/anydoc"

pnpm_packages_non_darwin:
    - cspell
    - promptfoo
    - stylelint

vscode_extensions:
    - davidanson.vscode-markdownlint
    - eamodio.gitlens
    - editorconfig.editorconfig
    - sdras.night-owl
    - usernamehw.errorlens
    - vscode-icons-team.vscode-icons
